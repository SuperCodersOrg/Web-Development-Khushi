<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

   

</head>


<body>

    <h1>Create Account</h1>


    <form action="/signin" method="POST">


        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <select name="role" required>

            <option value="">
                Select Role
            </option>

            <option value="student">
                Student
            </option>

            <option value="teacher">
                Teacher
            </option>

        </select>


        <button type="submit">
            Sign In
        </button>

    </form>


    <p>
        Already have an account?

        <a href="/login">
            Login
        </a>
    </p>

</body>

</html>
