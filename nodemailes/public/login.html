<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

   
    </style>

</head>


<body>

    <h1>Login</h1>


    <form action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>

<br>

<a href="/forgot-password">Forgot Password?</a>

<br><br>

<a href="/signin">Create an account</a>

</body>

</html>
